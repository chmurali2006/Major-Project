<text x="60" y="1410" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" fill="#101010" font-weight="700" text-anchor="start">Figure 1.  Protection and verification of a 512 × 512 dermoscopic image under a keyed, zero-training fragile watermark.</text>
<text x="60" y="1432" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.8" fill="#3a3a3a" font-weight="400" text-anchor="start">Black blocks are the system committed on `dev`, measured above. Grey dashed blocks are the learned refinement: implemented, unit-tested, and trained only in the preliminary PH2 run on the second measured row — not yet at scale.</text>
<text x="60" y="1451" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.8" fill="#3a3a3a" font-weight="400" text-anchor="start">Verification takes only the container bytes and the key: no original image and no tamper mask are available to it, and the function signature enforces this.</text>
<text x="60" y="1470" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.8" fill="#3a3a3a" font-weight="400" text-anchor="start">The tag is a function of the key, the block address and the block's own quantised detail coefficients, so a block pasted from elsewhere carries the tag of its old address and a block whose content changed carries the tag of its old content. A denial of the key leaves the reader no evidence to amplify: measured IoU falls from 0.8587 to 0.1047.</text>
<text x="60" y="1489" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.8" fill="#3a3a3a" font-weight="400" text-anchor="start">Limitations.  0.67 % of images yield a false claim under JPEG Q100, above this project's 0.5 % bound. PH2 is a stand-in corpus, not a benchmark: ISIC 2019 was unreachable from the build machine, so no PH2 number may be read as an ISIC one. The learned model is 0.64 M parameters at 5 epochs against the reference system's 15.1 M at convergence — not a capacity-matched comparison. The 0.832 IoU bar is a LiTS pixel-level figure and the 97.6 % detection figure is CheXpert; neither corpus was run, so neither number is claimed.</text>
