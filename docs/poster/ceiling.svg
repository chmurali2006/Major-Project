<polyline points="161.41,605.83 202.82,423.76 244.24,357.24 285.65,304.76 368.47,258.85 451.29,223.41 616.94,181.59 782.59,174.51 948.24,160.87" fill="none" stroke="#101010" stroke-width="2.4" stroke-linejoin="round"/>
<circle cx="161.41176470588235" cy="605.8333333333333" r="3.2" fill="#101010"/>
<text x="161.41176470588235" y="593.8333333333333" font-family="SF Mono, Menlo, Consolas, monospace" font-size="9.5" fill="#6b6b6b" font-weight="400" text-anchor="middle">0.513</text>
<circle cx="202.8235294117647" cy="423.7626262626263" r="3.2" fill="#101010"/>
<circle cx="244.23529411764707" cy="357.2358722358723" r="3.2" fill="#101010"/>
