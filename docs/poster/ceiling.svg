<text x="368.47058823529414" y="277.84641873278247" font-family="SF Mono, Menlo, Consolas, monospace" font-size="9.5" fill="#6b6b6b" font-weight="400" text-anchor="middle">0.854</text>
<circle cx="451.29411764705884" cy="223.40506838294453" r="3.2" fill="#101010"/>
<circle cx="616.9411764705883" cy="181.59090909090912" r="3.2" fill="#101010"/>
<text x="616.9411764705883" y="200.59090909090912" font-family="SF Mono, Menlo, Consolas, monospace" font-size="9.5" fill="#6b6b6b" font-weight="400" text-anchor="middle">0.930</text>
<circle cx="782.5882352941177" cy="174.5078406442044" r="3.2" fill="#101010"/>
<circle cx="948.2352941176471" cy="160.86817494154872" r="3.2" fill="#101010"/>
<text x="948.2352941176471" y="179.86817494154872" font-family="SF Mono, Menlo, Consolas, monospace" font-size="9.5" fill="#6b6b6b" font-weight="400" text-anchor="middle">0.950</text>
<line x1="328.40764983835857" y1="281.0545454545456" x2="328.40764983835857" y2="676" stroke="#6b6b6b" stroke-width="1.0" stroke-dasharray="3 3"/>
<text x="334.40764983835857" y="662" font-family="SF Mono, Menlo, Consolas, monospace" font-size="10.5" fill="#6b6b6b" font-weight="400" text-anchor="start">crosses at radius ≈ 40</text>
<circle cx="970.0" cy="110.0" r="4.5" fill="#1f4e79"/>
<text x="962.0" y="132.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" fill="#1f4e79" font-weight="600" text-anchor="end">block-aligned square paste  1.000</text>
<text x="590" y="460" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#b03a2e" font-weight="700" text-anchor="start">below the bar, at zero errors</text>
<text x="590" y="480" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.8" fill="#3a3a3a" font-weight="400" text-anchor="start">A system that classifies every one of the 4 096 blocks</text>
<text x="590" y="496" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.8" fill="#3a3a3a" font-weight="400" text-anchor="start">correctly still scores 0.809 on a radius-32 lesion.</text>
<text x="590" y="518" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.8" fill="#101010" font-weight="700" text-anchor="start">The gap is architectural, not a learning deficit.</text>
<text x="590" y="556" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" fill="#101010" font-weight="700" text-anchor="start">why this matters for the published comparison</text>
<text x="590" y="576" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.8" fill="#3a3a3a" font-weight="400" text-anchor="start">A localisation figure without its target size beside it</text>
<text x="590" y="592" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.8" fill="#3a3a3a" font-weight="400" text-anchor="start">is underdetermined: the same system scores 0.513 at</text>
<text x="590" y="608" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.8" fill="#3a3a3a" font-weight="400" text-anchor="start">radius 8 and 0.937 at radius 128. Two papers can report</text>
<text x="590" y="624" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.8" fill="#3a3a3a" font-weight="400" text-anchor="start">different IoU for identical methods and neither be wrong.</text>
<text x="1060" y="114" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#101010" font-weight="700" text-anchor="start">READING THE FIGURE</text>
<line x1="1060" y1="122" x2="1430" y2="122" stroke="#101010" stroke-width="1.1"/>
<text x="1060" y="144" font-family="SF Mono, Menlo, Consolas, monospace" font-size="10.5" fill="#6b6b6b" font-weight="600" text-anchor="start">grid</text>
<text x="1130" y="144" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.8" fill="#3a3a3a" font-weight="400" text-anchor="start">8 px blocks on 512 px</text>
<text x="1060" y="164" font-family="SF Mono, Menlo, Consolas, monospace" font-size="10.5" fill="#6b6b6b" font-weight="600" text-anchor="start">blocks</text>
<text x="1130" y="164" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.8" fill="#3a3a3a" font-weight="400" text-anchor="start">64 × 64 = 4 096</text>
<text x="1060" y="184" font-family="SF Mono, Menlo, Consolas, monospace" font-size="10.5" fill="#6b6b6b" font-weight="600" text-anchor="start">ceiling</text>
<text x="1130" y="184" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.8" fill="#3a3a3a" font-weight="400" text-anchor="start">a property of the grid</text>
<text x="1130" y="204" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.8" fill="#3a3a3a" font-weight="400" text-anchor="start">not of the model</text>
<text x="1060" y="244" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.8" fill="#101010" font-weight="700" text-anchor="start">The square-paste point is the control.</text>
<text x="1060" y="260" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.8" fill="#3a3a3a" font-weight="400" text-anchor="start">A block-aligned paste scores 1.000,</text>
<text x="1060" y="276" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.8" fill="#3a3a3a" font-weight="400" text-anchor="start">so this is a property of shape and</text>
<text x="1060" y="292" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.8" fill="#3a3a3a" font-weight="400" text-anchor="start">size, not a limitation of our</text>
<text x="1060" y="308" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.8" fill="#3a3a3a" font-weight="400" text-anchor="start">implementation. Without it the</text>
<text x="1060" y="324" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.8" fill="#3a3a3a" font-weight="400" text-anchor="start">curve reads as special pleading.</text>
<text x="1060" y="356" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" fill="#101010" font-weight="700" text-anchor="start">measured, not assumed</text>
<text x="1060" y="372" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.2" fill="#6b6b6b" font-weight="400" text-anchor="start">Produced by metrics.block_ceiling,</text>
<text x="1060" y="386" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.2" fill="#6b6b6b" font-weight="400" text-anchor="start">the function exercised by the tests</text>
<text x="1060" y="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.2" fill="#6b6b6b" font-weight="400" text-anchor="start">at r = 8/16/32/96/128/160.</text>
<line x1="70" y1="766" x2="1430" y2="766" stroke="#b9b9b9" stroke-width="1"/>
<text x="70" y="790" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" fill="#101010" font-weight="700" text-anchor="start">Figure 5.  Achievable pixel IoU for a block-granular tamper localiser, as a function of target size.</text>
<text x="70" y="812" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" fill="#3a3a3a" font-weight="400" text-anchor="start">Computed for an 8 × 8 decision grid: each block votes, and the vote is compared with an exact pixel mask. The classifier is assumed perfect, so every point is an upper bound.</text>
<text x="70" y="828" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" fill="#3a3a3a" font-weight="400" text-anchor="start">The published bar of 0.832 is measured on LiTS with synthetic lesion insertion, at a lesion size the source does not state (open question 2).</text>
<text x="70" y="844" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" fill="#3a3a3a" font-weight="400" text-anchor="start">This is why the learned layer refines at 512 px rather than at the grid resolution, and why every IoU in this work is reported with its bucket.</text>
</svg>