<line x1="948.2352941176471" y1="110" x2="948.2352941176471" y2="670" stroke="#dcdcdc" stroke-width="0.8"/>
<text x="948.2352941176471" y="688" font-family="SF Mono, Menlo, Consolas, monospace" font-size="10.5" fill="#6b6b6b" font-weight="400" text-anchor="middle">160</text>
