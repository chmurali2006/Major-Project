<text x="560.0" y="712" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" fill="#3a3a3a" font-weight="400" text-anchor="middle">tampered-region radius  (pixels)</text>
<text x="16" y="390.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" fill="#3a3a3a" text-anchor="middle" transform="rotate(-90 16 390.0)">best achievable pixel IoU</text>
<line x1="120" y1="281.0545454545456" x2="1000" y2="281.0545454545456" stroke="#b03a2e" stroke-width="1.8" stroke-dasharray="7 5"/>
