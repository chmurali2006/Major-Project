<text x="285.6470588235294" y="288.7580645161291" font-family="SF Mono, Menlo, Consolas, monospace" font-size="12" fill="#b03a2e" font-weight="700" text-anchor="middle">0.809</text>
<text x="285.6470588235294" y="326.7580645161291" font-family="SF Mono, Menlo, Consolas, monospace" font-size="10" fill="#6b6b6b" font-weight="400" text-anchor="middle">radius 32</text>
