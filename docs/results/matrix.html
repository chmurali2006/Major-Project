<text x="70" y="786" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" fill="#101010" font-weight="700" text-anchor="start">Figure 7.  Per-configuration localisation IoU.</text>
<text x="70" y="808" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" fill="#3a3a3a" font-weight="400" text-anchor="start">Two measurements from the classical control are drawn explicitly: the C0 floor, which every learned configuration must beat to have been worth building, and C9, which removes the key and so prices the security property.</text>
<text x="70" y="824" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" fill="#3a3a3a" font-weight="400" text-anchor="start">The contribution this figure makes is not that C8 is highest. It is that twelve configurations of one system, on one frozen protocol, make the individual contribution of each component visible — which a single reported aggregate cannot.</text>
<text x="70" y="840" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" fill="#3a3a3a" font-weight="400" text-anchor="start">Caveats that travel with it: PH2 is a stand-in corpus; 5 epochs and 72 training images is not convergence; and no configuration is compared against a published number, because the published corpora were not run.</text>
