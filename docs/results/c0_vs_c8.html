<text x="70" y="716" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" fill="#3a3a3a" font-weight="400" text-anchor="start">PH2 is a stand-in corpus, not a benchmark: ISIC 2019 was unreachable from the machine these runs were made on. A PH2 number must never be presented as an ISIC number.</text>
<text x="70" y="732" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" fill="#3a3a3a" font-weight="400" text-anchor="start">The learned model is 0.64 M parameters at 5 epochs on 72 training images. The reference system reports 15.1 M at convergence, so this is not a capacity-matched comparison.</text>
<text x="70" y="748" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" fill="#3a3a3a" font-weight="400" text-anchor="start">The memorisation gate fails at +0.0734 against a bound of 0.05 and is printed rather than dropped. Nothing here beats the published 0.832, which is a LiTS pixel-level figure and was not reproduced.</text>
